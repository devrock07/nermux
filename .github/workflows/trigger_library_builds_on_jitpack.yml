name: Trigger Nermux Library Builds on JitPack

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  trigger-nermux-library-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual setup
        run: |
          echo "Nermux app APK releases do not require JitPack library publishing."
          echo "Configure this workflow with the final public GitHub slug before publishing terminal-emulator, terminal-view, or termux-shared as JitPack libraries."
