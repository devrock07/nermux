name: Publish Latest Signed APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      package_variant:
        description: Bootstrap package variant to build
        required: true
        default: apt-android-7
        type: choice
        options:
          - apt-android-7
          - apt-android-5

permissions:
  contents: write

concurrency:
  group: nermux-latest-apk-release
  cancel-in-progress: false

jobs:
  publish-latest-apk:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VARIANT: ${{ inputs.package_variant || 'apt-android-7' }}
      RELEASE_TAG: nermux-latest
      RELEASE_TITLE: Nermux Latest APK
      NERMUX_RELEASE_STORE_FILE: ${{ runner.temp }}/nermux-release.jks
      NERMUX_RELEASE_KEY_ALIAS: ${{ secrets.NERMUX_RELEASE_KEY_ALIAS }}
      NERMUX_RELEASE_STORE_PASSWORD: ${{ secrets.NERMUX_RELEASE_STORE_PASSWORD }}
      NERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.NERMUX_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Run lightweight release checks
        shell: bash
        run: bash scripts/nermux-release-check.sh --skip-gradle

      - name: Decode release keystore
        shell: bash
        env:
          NERMUX_RELEASE_KEYSTORE_BASE64: ${{ secrets.NERMUX_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          for name in \
            NERMUX_RELEASE_KEYSTORE_BASE64 \
            NERMUX_RELEASE_KEY_ALIAS \
            NERMUX_RELEASE_STORE_PASSWORD \
            NERMUX_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$NERMUX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$NERMUX_RELEASE_STORE_FILE"
          chmod 600 "$NERMUX_RELEASE_STORE_FILE"

      - name: Build signed release APKs
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:7}"
          current_version_name="$(
            grep -m 1 -E '^[[:space:]]+versionName "[^"]+"$' app/build.gradle |
            sed -E 's/^[[:space:]]+versionName "([^"]+)"/\1/'
          )"

          app_version_name="${current_version_name}+${short_sha}"
          apk_version_tag="v${app_version_name}-${PACKAGE_VARIANT}-github-release"
          apk_dir_path="app/build/outputs/apk/release"
          apk_basename_prefix="nermux-app_${apk_version_tag}"

          echo "APP_VERSION_NAME=$app_version_name" >> "$GITHUB_ENV"
          echo "APK_VERSION_TAG=$apk_version_tag" >> "$GITHUB_ENV"
          echo "APK_DIR_PATH=$apk_dir_path" >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$apk_basename_prefix" >> "$GITHUB_ENV"

          export TERMUX_APP_VERSION_NAME="$app_version_name"
          export TERMUX_APK_VERSION_TAG="$apk_version_tag"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"
          export TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS=1

          chmod +x ./gradlew
          ./gradlew --no-daemon :app:lintDebug :app:assembleRelease

          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            apk_path="$apk_dir_path/${apk_basename_prefix}_${abi}.apk"
            if [[ ! -f "$apk_path" ]]; then
              echo "Missing expected APK: $apk_path" >&2
              ls -la "$apk_dir_path" >&2
              exit 1
            fi
          done

          (
            cd "$apk_dir_path"
            sha256sum \
              "${apk_basename_prefix}_universal.apk" \
              "${apk_basename_prefix}_arm64-v8a.apk" \
              "${apk_basename_prefix}_armeabi-v7a.apk" \
              "${apk_basename_prefix}_x86_64.apk" \
              "${apk_basename_prefix}_x86.apk" \
              > "${apk_basename_prefix}_sha256sums.txt"
          )

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Latest signed Nermux APKs built automatically from GitHub Actions.

          Commit: \`${GITHUB_SHA}\`
          Branch: \`${GITHUB_REF_NAME}\`
          Version: \`${APP_VERSION_NAME}\`
          Package variant: \`${PACKAGE_VARIANT}\`

          Most users should download:

          \`${APK_BASENAME_PREFIX}_universal.apk\`

          SHA-256 hashes are attached in:

          \`${APK_BASENAME_PREFIX}_sha256sums.txt\`

          These APKs are release builds signed with the Nermux release key configured in this repository's GitHub Actions secrets.

          This release is updated automatically on every push to \`main\` or \`master\`.
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums.txt
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest

            existing_assets="$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' || true)"
            if [[ -n "$existing_assets" ]]; then
              while IFS= read -r asset_name; do
                [[ -z "$asset_name" ]] && continue
                gh release delete-asset "$RELEASE_TAG" "$asset_name" -y
              done <<< "$existing_assets"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$RELEASE_TAG" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86_64.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums.txt" \
            --clobber
