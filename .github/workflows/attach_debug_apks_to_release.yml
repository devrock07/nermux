name: Manual Debug APK Release Notice

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Show replacement workflow
        run: |
          echo "Signed release APKs are now published by .github/workflows/publish_latest_apk.yml."
          echo "Push to main/master or run the 'Publish Latest Signed APK' workflow manually."
