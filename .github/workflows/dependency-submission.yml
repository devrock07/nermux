name: Automatic Dependency Submission

on:
  push:
    branches: [ 'main', 'master' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6
      # Private/forked repos can have GitHub Dependency Graph disabled.
      # In that case the Gradle graph generation succeeds, but GitHub rejects
      # the snapshot upload. Keep the workflow green until repo security
      # settings are enabled.
      continue-on-error: true
