buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}

subprojects {
    tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
        options.compilerArgs.add("-Xlint:-options")
    }
}
